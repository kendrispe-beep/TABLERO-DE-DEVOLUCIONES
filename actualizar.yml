name: Actualizar tablero de devoluciones

on:
  schedule:
    - cron: "30 14 * * *"   # todos los días 9:30 a. m. hora Colombia (14:30 UTC)
  workflow_dispatch: {}      # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-tablero
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "snowflake-connector-python>=3.12" "cryptography>=42"

      - name: Consultar Snowflake y actualizar index.html
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          TABLERO_USUARIO: ${{ secrets.TABLERO_USUARIO }}
          TABLERO_CLAVE: ${{ secrets.TABLERO_CLAVE }}
          TABLERO_GH_TOKEN: ${{ secrets.TABLERO_GH_TOKEN }}
        run: python scripts/actualizar.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática del tablero $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git push
          fi
